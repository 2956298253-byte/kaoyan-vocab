<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语二 · 六级核心词汇</title>
<style>
  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --ink: #1f2430;
    --ink-2: #6b7280;
    --line: #e6e8ef;
    --accent: #5b5bd6;
    --accent-2: #7c5cd6;
    --ok: #16a34a;
    --ok-bg: #e9f9ef;
    --blue: #2563eb;
    --blue-bg: #e8f0fe;
    --warn: #d97706;
    --warn-bg: #fef3e2;
    --bad: #dc2626;
    --bad-bg: #fdeaea;
    --shadow: 0 1px 3px rgba(20,24,40,.06), 0 8px 24px rgba(20,24,40,.06);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }

  /* 顶部 */
  header { padding: 8px 0 18px; }
  header h1 {
    margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .5px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  header .sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; font-size: 13px; color: var(--ink-2); box-shadow: var(--shadow);
  }
  .stat b { color: var(--ink); font-size: 16px; margin-left: 4px; }
  .stat.ok b { color: var(--ok); }
  .stat.warn b { color: var(--warn); }
  .data-tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* 筛选栏 */
  .filters {
    position: sticky; top: 0; z-index: 30;
    background: rgba(244,245,249,.92); backdrop-filter: blur(8px);
    padding: 10px 0; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
  }
  .frow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .frow + .frow { margin-top: 8px; }
  .label { font-size: 12px; color: var(--ink-2); flex: 0 0 auto; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
    padding: 5px 11px; border-radius: 999px; font-size: 13px; cursor: pointer;
    user-select: none; transition: all .15s; white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .letters { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .letters .chip { min-width: 30px; flex: 0 0 auto; text-align: center; padding: 5px 8px; }
  .search {
    flex: 1 1 180px; min-width: 140px; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 14px; outline: none; background: var(--card); color: var(--ink);
  }
  .search:focus { border-color: var(--accent); }

  /* 模式切换 */
  .modes { display: flex; gap: 6px; margin: 14px 0 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px; box-shadow: var(--shadow); }
  .mode {
    flex: 1; text-align: center; padding: 9px 6px; border-radius: 10px; cursor: pointer;
    font-size: 14px; color: var(--ink-2); font-weight: 500; transition: all .15s;
  }
  .mode.on { background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff; }

  /* 卡片 */
  .card-stage { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .card {
    width: 100%; max-width: 560px; min-height: 300px; background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 36px 28px; text-align: center; cursor: pointer; position: relative;
    transition: transform .15s; user-select: none;
  }
  .card:active { transform: scale(.99); }
  .card .badge { position: absolute; top: 18px; right: 18px; }
  .card .word { font-size: 44px; font-weight: 800; letter-spacing: .5px; word-break: break-word; }
  .card .phonetic { font-size: 20px; color: var(--accent); margin-top: 10px; font-family: "Segoe UI", "Times New Roman", serif; }
  .card .pos-tag { display: inline-block; background: #eef0ff; color: var(--accent); padding: 3px 10px; border-radius: 8px; font-size: 14px; margin-top: 14px; }
  .card .meaning { font-size: 22px; margin-top: 14px; font-weight: 600; }
  .card .sense { display: flex; align-items: baseline; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .card .stag { display: inline-block; background: #eef0ff; color: var(--accent); padding: 2px 9px; border-radius: 6px; font-size: 13px; flex: 0 0 auto; }
  .card .sm { font-size: 21px; font-weight: 600; }
  .card .hint { position: absolute; bottom: 14px; left: 0; right: 0; font-size: 12px; color: var(--ink-2); }
  .speak {
    border: none; background: #eef0ff; color: var(--accent); width: 42px; height: 42px;
    border-radius: 50%; font-size: 20px; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; transition: all .15s; flex: 0 0 auto;
  }
  .speak:hover { background: var(--accent); color: #fff; }
  .word-row { display: flex; align-items: center; gap: 14px; }

  .card-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .15s; color: #fff;
  }
  .btn.bad { background: var(--bad); }
  .btn.bad:hover { background: #b91c1c; }
  .btn.ok { background: var(--ok); }
  .btn.ok:hover { background: #15803d; }
  .btn.ghost { background: #fff; color: var(--ink-2); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn.small { padding: 8px 16px; font-size: 14px; }
  .btn:disabled { opacity: .35; cursor: default; }

  .progress-line { width: 100%; max-width: 560px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress-line > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width .2s; }
  .counter { font-size: 13px; color: var(--ink-2); }

  /* 测验 */
  .quiz { max-width: 620px; margin: 0 auto; }
  .quiz-q { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 34px 26px; text-align: center; }
  .quiz-q .word { font-size: 36px; font-weight: 800; word-break: break-word; }
  .quiz-q .phonetic { font-size: 18px; color: var(--accent); margin-top: 6px; }
  .quiz-q .meaning { font-size: 26px; font-weight: 600; }
  .quiz-q .meta { font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .opts { display: grid; gap: 10px; margin-top: 16px; }
  .opt {
    border: 1.5px solid var(--line); background: var(--card); border-radius: 14px;
    padding: 14px 18px; font-size: 16px; cursor: pointer; text-align: left;
    transition: all .15s; box-shadow: var(--shadow);
  }
  .opt:hover { border-color: var(--accent); }
  .opt.right { border-color: var(--blue); background: var(--blue-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt:disabled { cursor: default; }
  .quiz-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; flex-wrap: wrap; }
  .score { font-size: 14px; color: var(--ink-2); }
  .score b { color: var(--accent); font-size: 18px; }
  .quiz-setup { max-width: 620px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px; }
  .quiz-setup h3 { margin: 0 0 6px; }
  .quiz-setup .row { margin-top: 16px; }
  .quiz-setup .row .label { display: block; margin-bottom: 8px; font-size: 13px; }
  .result-box { text-align: center; padding: 30px; }
  .result-box .big { font-size: 40px; font-weight: 800; color: var(--accent); }

  /* 词表 */
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .list-head .info { font-size: 13px; color: var(--ink-2); }
  .witem {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .witem .word { font-weight: 700; font-size: 16px; min-width: 150px; }
  .witem .phonetic { color: var(--accent); font-size: 13px; font-family: "Segoe UI", serif; }
  .witem .def { flex: 1; color: var(--ink-2); font-size: 14px; }
  .witem .def .m { color: var(--ink); }
  .witem .status-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .status-dot.known { background: var(--ok); }
  .status-dot.learning { background: var(--warn); }
  .status-dot.new { background: #cbd5e1; }

  .badge-t {
    font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; color: #fff; flex: 0 0 auto;
  }
  .badge-t.t1 { background: #e11d48; }
  .badge-t.t2 { background: #f59e0b; }
  .badge-t.t3 { background: #2563eb; }
  .badge-t.t4 { background: #0d9488; }

  .pager { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 16px; }
  .empty { text-align: center; color: var(--ink-2); padding: 50px 0; font-size: 15px; }

  .freq {
    display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center;
    margin-top: 12px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: #f6f7ff; color: var(--accent);
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .freq:hover { border-color: var(--accent); background: #eef0ff; }
  .freq .c6 { color: #2563eb; }
  .freq .e2 { color: #0d9488; }
  .freq .e1 { color: #7c3aed; }
  .freq .sep { color: var(--ink-2); opacity: .6; }
  .freq.empty { color: var(--ink-2); cursor: default; background: #f0f1f5; }

  .modal {
    position: fixed; inset: 0; background: rgba(20,24,40,.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box {
    background: var(--card); border-radius: 16px; padding: 24px 26px; max-width: 540px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.22); position: relative; max-height: 80vh; overflow: auto;
  }
  .modal-close { position: absolute; top: 12px; right: 16px; cursor: pointer; color: var(--ink-2); font-size: 20px; line-height: 1; }
  .modal-close:hover { color: var(--ink); }
  .modal-title { font-size: 20px; font-weight: 800; padding-right: 30px; word-break: break-word; }
  .modal-counts { font-size: 14px; color: var(--ink-2); margin-top: 6px; margin-bottom: 14px; }
  .modal-counts b { color: var(--accent); }
  .modal-body .wline { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.6; word-break: break-word; }
  .modal-body .wline:first-child { border-top: none; }
  .wc-word-row { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
  .wc-word { font-size: 32px; font-weight: 800; word-break: break-word; }
  .wc-phon { font-size: 18px; color: var(--accent); margin-top: 8px; }
  .wc-senses { margin-top: 12px; }
  .wc-senses .sense { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .wc-senses .sense:first-child { margin-top: 0; }
  .wc-senses .stag { display: inline-block; background: #eef0ff; color: var(--accent); padding: 2px 9px; border-radius: 6px; font-size: 13px; flex: 0 0 auto; }
  .wc-senses .sm { font-size: 19px; font-weight: 600; }
  #wcFreq { cursor: default; }

  .hidden { display: none !important; }
  .sign { text-align: center; color: var(--ink-2); font-size: 13px; margin: 30px 0 12px; opacity: .8; }
  @media (max-width: 600px) {
    .card .word { font-size: 34px; }
    .card .sm { font-size: 18px; }
    .quiz-q .word { font-size: 28px; }
    .witem { flex-wrap: wrap; row-gap: 8px; }
    .witem .word { min-width: auto; }
    .witem .def { flex: 1 1 100%; order: 5; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>考研英语一 · 英语二 · 六级核心词汇</h1>
    <div class="sub">按字母 A–Z + 难度分级</div>
    <div class="stats" id="stats"></div>
    <div class="data-tools">
      <button class="btn ghost small" id="exportBtn">💾 导出进度</button>
      <button class="btn ghost small" id="importBtn">📂 导入进度</button>
      <button class="btn ghost small" id="resetBtn">🗑 重置进度</button>
      <input type="file" id="importFile" accept=".json,application/json" class="hidden">
    </div>
  </header>

  <div class="filters">
    <div class="frow">
      <span class="label">字母</span>
      <div class="letters" id="letters"></div>
    </div>
    <div class="frow">
      <span class="label">难度</span>
      <div class="chips" id="tierChips"></div>
      <span class="label" style="margin-left:6px">状态</span>
      <div class="chips" id="statusChips"></div>
      <input class="search" id="search" type="text" placeholder="搜索单词…">
    </div>
  </div>

  <div class="modes" id="modes">
    <div class="mode on" data-mode="card">📇 单词卡片</div>
    <div class="mode" data-mode="quiz">✍️ 选择题测验</div>
    <div class="mode" data-mode="list">📚 词表浏览</div>
  </div>

  <!-- 卡片模式 -->
  <div id="panel-card">
    <div class="card-stage">
      <div class="progress-line"><div id="cardProg"></div></div>
      <div class="counter" id="cardCounter"></div>
      <div class="card" id="card">
        <div class="badge" id="cardBadge"></div>
        <div class="word-row">
          <span class="word" id="cardWord"></span>
          <button class="speak" id="cardSpeak" title="朗读">🔊</button>
        </div>
        <div class="phonetic" id="cardPhon"></div>
        <button class="freq" id="cardFreq"></button>
        <div class="flip" id="cardFlip"></div>
        <div class="hint">点击卡片翻转 · 空格键翻转 · ← 不认识 · → 认识</div>
      </div>
      <div class="card-actions">
        <button class="btn ghost small" id="cardPrev">← 上一个</button>
        <button class="btn ghost small" id="cardShuffle">🔀 随机顺序</button>
        <button class="btn bad" id="cardNo">不认识</button>
        <button class="btn ok" id="cardYes">认识</button>
      </div>
    </div>
  </div>

  <!-- 测验模式 -->
  <div id="panel-quiz" class="hidden">
    <div class="quiz-setup" id="quizSetup">
      <h3>选择题测验</h3>
      <div class="row">
        <span class="label">题型</span>
        <div class="chips" id="quizDirChips"></div>
      </div>
      <div class="row">
        <span class="label">题量</span>
        <div class="chips" id="quizNumChips"></div>
      </div>
      <div class="row">
        <span class="label">范围</span>
        <div class="chips" id="quizScopeChips"></div>
      </div>
      <div class="card-actions" style="margin-top:20px">
        <button class="btn" style="background:linear-gradient(120deg,var(--accent),var(--accent-2))" id="quizStart">开始测验</button>
      </div>
    </div>
    <div class="quiz hidden" id="quizRun">
      <div class="progress-line"><div id="quizProg"></div></div>
      <div class="quiz-q" id="quizQ">
        <div class="meta" id="quizMeta"></div>
        <div class="word-row" style="justify-content:center">
          <span class="word" id="quizWord"></span>
          <button class="speak hidden" id="quizSpeak">🔊</button>
        </div>
        <div class="phonetic" id="quizPhon"></div>
        <div class="meaning hidden" id="quizMeaning"></div>
      </div>
      <div class="opts" id="quizOpts"></div>
      <div class="quiz-actions">
        <div class="score">答对 <b id="quizRight">0</b> / <span id="quizTotal">0</span></div>
        <button class="btn ghost small" id="quizNext">下一题 →</button>
      </div>
    </div>
    <div class="result-box hidden" id="quizResult"></div>
  </div>

  <!-- 词表模式 -->
  <div id="panel-list" class="hidden">
    <div class="list-head">
      <div class="info" id="listInfo"></div>
    </div>
    <div id="list"></div>
    <div class="pager">
      <button class="btn ghost small" id="prevPage">上一页</button>
      <span class="counter" id="pageInfo"></span>
      <button class="btn ghost small" id="nextPage">下一页</button>
    </div>
  </div>

  <!-- 词频出处弹窗 -->
  <div class="modal hidden" id="freqModal">
    <div class="modal-box">
      <div class="modal-close" id="freqClose">✕</div>
      <div class="modal-title" id="freqTitle"></div>
      <div class="modal-counts" id="freqCounts"></div>
      <div class="modal-body" id="freqBody"></div>
    </div>
  </div>

  <!-- 单词卡片弹窗（测验点选项查看） -->
  <div class="modal hidden" id="wordModal">
    <div class="modal-box">
      <div class="modal-close" id="wordClose">✕</div>
      <div class="wc-word-row">
        <span class="wc-word" id="wcWord"></span>
        <button class="speak" id="wcSpeak" title="朗读">🔊</button>
      </div>
      <div class="wc-phon" id="wcPhon"></div>
      <div class="freq" id="wcFreq"></div>
      <div class="wc-senses" id="wcSenses"></div>
    </div>
  </div>

  <footer class="sign">嘿嘿呦</footer>

// ---------- 常量 ----------
const LS_KEY = 'vocab_progress_v1';
const TIERS = [
  { id: 0, label: '全部难度', icon: '' },
  { id: 1, label: '必背 ★★★', icon: '★★★', cls: 't1' },
  { id: 2, label: '高频 ★★', icon: '★★', cls: 't2' },
  { id: 3, label: '进阶 ★', icon: '★', cls: 't3' },
  { id: 4, label: '专业 ◆', icon: '◆', cls: 't4' },
];
const STATUS = [
  { id: 'all', label: '全部' },
  { id: 'new', label: '未学' },
  { id: 'learning', label: '待复习' },
  { id: 'known', label: '已掌握' },
];

// ---------- 状态 ----------
const state = {
  mode: 'card',
  letter: 'all',       // 'all' | A-Z
  tier: 0,             // 0=全部
  status: 'all',
  search: '',
  // 卡片
  queue: [], idx: 0, flipped: false, shuffle: true,
  // 测验
  quiz: { dir: 'w2m', num: 10, scope: 'filter', items: [], opts: [], i: 0, right: 0, locked: false },
  // 词表
  page: 0, pageSize: 60,
};

let progress = {}; // word -> 'learning' | 'known'
function save() { localStorage.setItem(LS_KEY, JSON.stringify(progress)); }
function load() {
  try { progress = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
  catch (e) { progress = {}; }
}
function statusOf(w) { return progress[w] || 'new'; }

// ---------- 工具 ----------
const $ = s => document.querySelector(s);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 词频标签（六级/英二/英一出现次数）
function freqLabel(w) {
  const parts = [];
  if (w.cet6 != null) parts.push({ kind: 'c6', label: `六级 ${w.cet6}次` });
  if (w.en2 != null) parts.push({ kind: 'e2', label: `英二 ${w.en2}次` });
  if (w.en1 != null) parts.push({ kind: 'e1', label: `英一 ${w.en1}次` });
  return parts;
}

// 发音
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  // 预热引擎：加载后发一句静音短句，先把系统 TTS 拉起来，避免首次点击延迟
  let warmed = false;
  const warmUp = () => {
    if (warmed) return;
    warmed = true;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.rate = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  };
  if (speechSynthesis.getVoices().length) warmUp();
  speechSynthesis.onvoiceschanged = () => { pickVoice(); warmUp(); };
}
function speak(word) {
  if (!('speechSynthesis' in window)) return;
  // 只在上一句还没读完时才取消，避免每次 cancel 造成的额外延迟
  if (speechSynthesis.speaking) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = 0.9;
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

// 排序 / 筛选
function filtered() {
  let list = WORDS.filter(w => {
    if (state.letter !== 'all' && w.letter !== state.letter) return false;
    if (state.tier !== 0 && w.tier !== state.tier) return false;
    if (state.status !== 'all' && statusOf(w.w) !== state.status) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!(w.w.toLowerCase().includes(q) || w.m.includes(state.search) || w.p.includes(state.search))) return false;
    }
    return true;
  });
  return list;
}

// ---------- 渲染统计 ----------
function renderStats() {
  let known = 0, learning = 0, neu = 0;
  for (const w of WORDS) {
    const s = statusOf(w.w);
    if (s === 'known') known++; else if (s === 'learning') learning++; else neu++;
  }
  $('#stats').innerHTML = `
    <div class="stat">总词数<b>${WORDS.length}</b></div>
    <div class="stat ok">已掌握<b>${known}</b></div>
    <div class="stat warn">待复习<b>${learning}</b></div>
    <div class="stat">未学<b>${neu}</b></div>
  `;
}

// ---------- 渲染筛选 ----------
function renderLetters() {
  const all = ['all', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
  $('#letters').innerHTML = all.map(l =>
    `<div class="chip ${state.letter===l?'on':''}" data-l="${l}">${l==='all'?'全部':l}</div>`
  ).join('');
}

  $('#tierChips').innerHTML = TIERS.map(t =>

}

  $('#statusChips').innerHTML = STATUS.map(s =>

}

  $('#quizScopeChips').innerHTML = [
    { id: 'filter', label: '当前筛选范围' },
    { id: 'all', label: '全部词汇' },
  ].map(o => `<div class="chip ${state.quiz.scope===o.id?'on':''}" data-qs="${o.id}">${o.label}</div>`).join('');
}

// ---------- 模式切换 ----------
function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.mode').forEach(el => el.classList.toggle('on', el.dataset.mode === m));
  $('#panel-card').classList.toggle('hidden', m !== 'card');
  $('#panel-quiz').classList.toggle('hidden', m !== 'quiz');
  $('#panel-list').classList.toggle('hidden', m !== 'list');
  if (m === 'card') startCard();
  if (m === 'quiz') resetQuiz();
  if (m === 'list') renderList();
}

// ---------- 卡片 ----------
function startCard() {
  state.queue = filtered();
  if (state.shuffle) state.queue = shuffleArr(state.queue.slice());
  state.idx = 0; state.flipped = false;
  renderCard();
}
function shuffleArr(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderCard() {
  const q = state.queue;
  if (!q.length) {
    $('#card').classList.add('hidden');
    $('#cardCounter').textContent = '没有符合条件的单词';
    $('#cardProg').style.width = '0%';
    return;
  }
  $('#card').classList.remove('hidden');
  const w = q[state.idx];
  $('#cardProg').style.width = ((state.idx) / q.length * 100) + '%';
  $('#cardCounter').textContent = `${state.idx + 1} / ${q.length}`;
  $('#cardPrev').disabled = state.idx <= 0;
  $('#cardWord').textContent = w.w;
  $('#cardPhon').textContent = w.p ? '/' + w.p + '/' : '';
  const fl = freqLabel(w);
  if (fl.length) {
    $('#cardFreq').classList.remove('empty');
    $('#cardFreq').innerHTML = fl.map(x => `<span class="${x.kind}">${esc(x.label)}</span>`).join('<span class="sep">·</span>');
  } else {
    $('#cardFreq').classList.add('empty');
    $('#cardFreq').textContent = '暂无真题词频';
  }
  const t = TIERS[w.tier];
  let badge = `<span class="badge-t ${t.cls}">${t.icon} ${t.label.replace(/ [★◆]+/,'')}</span>`;
  if (w.star.includes('◆') && w.tier !== 4) badge += ` <span class="badge-t t4">◆</span>`;
  $('#cardBadge').innerHTML = badge;
  state.flipped = false;
  $('#cardFlip').innerHTML = '';
}

function flipCard() {
  if (!state.queue.length) return;
  const w = state.queue[state.idx];
  if (!state.flipped) {
    $('#cardFlip').innerHTML = w.senses.map(s =>
      `<div class="sense">${s.pos ? `<span class="stag">${esc(s.pos)}</span>` : ''}<span class="sm">${esc(s.m)}</span></div>`
    ).join('');
    state.flipped = true;
  } else {
    $('#cardFlip').innerHTML = '';
    state.flipped = false;
  }
}

function mark(known) {
  if (!state.queue.length) return;
  const w = state.queue[state.idx];
  progress[w.w] = known ? 'known' : 'learning';
  save();
  if (state.idx < state.queue.length - 1) { state.idx++; } else { startCard(); return; }
  renderCard(); renderStats();
}

function prevCard() {
  if (!state.queue.length || state.idx <= 0) return;
  state.idx--;
  renderCard();
}

// 显示词频出处
function showFreq(w) {
  if (!w) return;
  $('#freqTitle').textContent = w.w;
  const fl = freqLabel(w);
  $('#freqCounts').innerHTML = fl.length ? fl.map(x => `<b>${esc(x.label)}</b>`).join(' · ') : '暂无词频数据';
  $('#freqBody').innerHTML = (w.where && w.where.length)
    ? w.where.map(s => `<div class="wline">${esc(s)}</div>`).join('')
    : '<div class="wline">本版词表仅统计出现次数，未标注具体出处位置。</div>';
  $('#freqModal').classList.remove('hidden');
}

// 单词卡片弹窗（测验作答后点选项查看）
function showWordCard(w) {
  if (!w) return;
  $('#wcWord').textContent = w.w;
  $('#wcPhon').textContent = w.p ? '/' + w.p + '/' : '';
  $('#wcSenses').innerHTML = w.senses.map(s =>
    `<div class="sense">${s.pos ? `<span class="stag">${esc(s.pos)}</span>` : ''}<span class="sm">${esc(s.m)}</span></div>`
  ).join('');
  const fl = freqLabel(w);
  $('#wcFreq').innerHTML = fl.length ? fl.map(x => `<span class="${x.kind}">${esc(x.label)}</span>`).join('<span class="sep">·</span>') : '暂无词频数据';
  $('#wordModal').classList.remove('hidden');
}

// ---------- 测验 ----------
function resetQuiz() {
  $('#quizSetup').classList.remove('hidden');
  $('#quizRun').classList.add('hidden');
  $('#quizResult').classList.add('hidden');
}
function startQuiz() {
  const pool = state.quiz.scope === 'all' ? WORDS.slice() : filtered();
  if (!pool.length) return;
  const n = Math.min(state.quiz.num, pool.length);
  const items = shuffleArr(pool.slice()).slice(0, n);
  state.quiz.items = items; state.quiz.i = 0; state.quiz.right = 0; state.quiz.locked = false;
  $('#quizSetup').classList.add('hidden');
  $('#quizRun').classList.remove('hidden');
  $('#quizResult').classList.add('hidden');
  renderQuiz();
}
function renderQuiz() {
  const q = state.quiz;
  const item = q.items[q.i];
  const dir = q.dir;
  $('#quizProg').style.width = (q.i / q.items.length * 100) + '%';
  $('#quizMeta').textContent = `第 ${q.i + 1} / ${q.items.length} 题 · ${dir === 'w2m' ? '看单词选中文' : '看中文选单词'}`;
  $('#quizRight').textContent = q.right;
  $('#quizTotal').textContent = q.items.length;
  $('#quizNext').classList.add('hidden');

  if (dir === 'w2m') {
    $('#quizWord').textContent = item.w;
    $('#quizWord').classList.remove('hidden');
    $('#quizSpeak').classList.remove('hidden');
    $('#quizPhon').textContent = item.p ? `/${item.p}/` : '';
    $('#quizMeaning').classList.add('hidden');
  } else {
    $('#quizWord').classList.add('hidden');
    $('#quizSpeak').classList.add('hidden');
    $('#quizPhon').textContent = '';
    $('#quizMeaning').classList.remove('hidden');
    $('#quizMeaning').textContent = item.m;
  }

  // 生成选项（每个选项保留对应单词，作答后可点选项查看卡片）
  const distractors = pickDistractors(item, 3);
  const opts = shuffleArr([
    { w: item, text: dir === 'w2m' ? item.m : item.w, correct: true },
    ...distractors.map(d => ({ w: d, text: dir === 'w2m' ? d.m : d.w, correct: false }))
  ]);
  q.opts = opts;
  $('#quizOpts').innerHTML = opts.map((o, i) =>
    `<button class="opt" data-i="${i}">${esc(o.text)}</button>`).join('');
  q.locked = false;
}
function pickDistractors(item, k) {
  const pool = WORDS.filter(w => w.w !== item.w && w.m !== item.m);
  return shuffleArr(pool).slice(0, k);
}
function answerQuiz(i) {
  const q = state.quiz;
  if (q.locked) return;
  q.locked = true;
  const item = q.items[q.i];
  const btns = [...document.querySelectorAll('#quizOpts .opt')];
  const dir = q.dir;
  const correctText = dir === 'w2m' ? item.m : item.w;
  btns.forEach((b, bi) => {
    const isRight = b.textContent === correctText;
    if (isRight) b.classList.add('right');
    if (bi === i && isRight) q.right++;
    if (bi === i && !isRight) b.classList.add('wrong');
  });
  $('#quizRight').textContent = q.right;
  $('#quizNext').classList.remove('hidden');
}
function nextQuiz() {
  const q = state.quiz;
  q.i++;
  if (q.i >= q.items.length) {
    $('#quizRun').classList.add('hidden');
    $('#quizResult').classList.remove('hidden');
    const pct = Math.round(q.right / q.items.length * 100);
    $('#quizResult').innerHTML = `
      <div class="big">${q.right} / ${q.items.length}</div>
      <div class="counter">正确率 ${pct}%</div>
      <div class="card-actions" style="margin-top:20px">
        <button class="btn ghost small" id="quizAgain">再来一组</button>
        <button class="btn" style="background:linear-gradient(120deg,var(--accent),var(--accent-2))" id="quizBack">返回设置</button>
      </div>`;
    $('#quizAgain').onclick = startQuiz;
    $('#quizBack').onclick = resetQuiz;
  } else {
    renderQuiz();
  }
}

// ---------- 词表 ----------
function renderList() {
  const list = filtered();
  const totalPages = Math.max(1, Math.ceil(list.length / state.pageSize));
  if (state.page >= totalPages) state.page = totalPages - 1;
  if (state.page < 0) state.page = 0;
  const start = state.page * state.pageSize;
  const slice = list.slice(start, start + state.pageSize);
  $('#listInfo').textContent = `共 ${list.length} 个单词 · 第 ${start + 1}–${Math.min(start + state.pageSize, list.length)} 条`;
  $('#pageInfo').textContent = `${state.page + 1} / ${totalPages}`;

  if (!slice.length) {
    $('#list').innerHTML = `<div class="empty">没有符合条件的单词，试试调整筛选条件。</div>`;
    return;
  }
  $('#list').innerHTML = slice.map(w => {
    const t = TIERS[w.tier];
    const s = statusOf(w.w);
    return `<div class="witem">
      <span class="status-dot ${s}"></span>
      <span class="word">${esc(w.w)}</span>
      <span class="phonetic">${w.p ? '/' + esc(w.p) + '/' : ''}</span>
      <span class="badge-t ${t.cls}">${t.icon} ${t.label.replace(/ [★◆]+/,'')}</span>
      <span class="def"><span class="m">${w.senses.map(s => (s.pos ? '<i>'+esc(s.pos)+'</i> ' : '') + esc(s.m)).join('；')}</span></span>
      <button class="speak" data-speak="${esc(w.w)}">🔊</button>
    </div>`;
  }).join('');
}

// ---------- 导出 / 导入进度 ----------
function refreshAfterProgressChange() {
  renderStats();
  if (state.mode === 'card') startCard();
  else if (state.mode === 'list') renderList();
}

function exportProgress() {
  const data = { app: 'kaoyan-vocab', version: 1, exportedAt: new Date().toISOString(), total: WORDS.length, progress };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  a.href = url;
  a.download = `背单词进度_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importProgress(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const p = data && typeof data === 'object' && !Array.isArray(data) ? (data.progress || data) : null;
      if (!p || typeof p !== 'object' || Array.isArray(p)) throw new Error('bad');
      let known = 0, learning = 0;
      const clean = {};
      for (const k in p) {
        if (p[k] === 'known') { clean[k] = 'known'; known++; }
        else if (p[k] === 'learning') { clean[k] = 'learning'; learning++; }
      }
      if (!confirm(`导入将覆盖当前进度。\n文件包含：已掌握 ${known} 个、待复习 ${learning} 个。\n确认导入？`)) return;
      progress = clean; save(); refreshAfterProgressChange();
      alert(`导入成功：已掌握 ${known} 个、待复习 ${learning} 个。`);
    } catch (err) {
      alert('导入失败：文件格式不正确，请选择之前导出的进度文件。');
    }
  };
  reader.readAsText(file);
}

function resetProgress() {
  if (!confirm('确定清空所有学习进度吗？此操作不可撤销。')) return;
  progress = {}; save(); refreshAfterProgressChange();
}

// ---------- 事件绑定 ----------
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const l = chip.dataset.l; if (l !== undefined) { state.letter = l; renderLetters(); onFilter(); return; }
    const t = chip.dataset.t; if (t !== undefined) { state.tier = +t; renderTierChips(); onFilter(); return; }
    const s = chip.dataset.s; if (s !== undefined) { state.status = s; renderStatusChips(); onFilter(); return; }
    const qd = chip.dataset.qd; if (qd !== undefined) { state.quiz.dir = qd; renderQuizDirChips(); return; }
    const qn = chip.dataset.qn; if (qn !== undefined) { state.quiz.num = +qn; renderQuizNumChips(); return; }
    const qs = chip.dataset.qs; if (qs !== undefined) { state.quiz.scope = qs; renderQuizScopeChips(); return; }
  }
  const mode = e.target.closest('.mode'); if (mode) { setMode(mode.dataset.mode); return; }
  const speakBtn = e.target.closest('[data-speak]');
  if (speakBtn) { speak(speakBtn.dataset.speak); return; }
});

$('#card').addEventListener('click', flipCard);
$('#cardPrev').addEventListener('click', prevCard);
$('#cardFreq').addEventListener('click', e => { e.stopPropagation(); if (state.queue.length) showFreq(state.queue[state.idx]); });
$('#freqClose').addEventListener('click', () => $('#freqModal').classList.add('hidden'));
$('#freqModal').addEventListener('click', e => { if (e.target === e.currentTarget) $('#freqModal').classList.add('hidden'); });
$('#wordClose').addEventListener('click', () => $('#wordModal').classList.add('hidden'));
$('#wordModal').addEventListener('click', e => { if (e.target === e.currentTarget) $('#wordModal').classList.add('hidden'); });
$('#wcSpeak').addEventListener('click', e => { e.stopPropagation(); speak($('#wcWord').textContent); });
$('#cardSpeak').addEventListener('click', e => { e.stopPropagation(); speak($('#cardWord').textContent); });
$('#cardYes').addEventListener('click', () => mark(true));
$('#cardNo').addEventListener('click', () => mark(false));
$('#cardShuffle').addEventListener('click', () => { state.shuffle = !state.shuffle; $('#cardShuffle').textContent = state.shuffle ? '🔀 随机顺序' : '🔢 字母顺序'; startCard(); });
$('#quizStart').addEventListener('click', startQuiz);
$('#quizNext').addEventListener('click', nextQuiz);
$('#quizSpeak').addEventListener('click', () => speak($('#quizWord').textContent));
$('#quizOpts').addEventListener('click', e => {
  const o = e.target.closest('.opt');
  if (!o) return;
  const i = +o.dataset.i;
  if (state.quiz.locked) showWordCard(state.quiz.opts[i] && state.quiz.opts[i].w);
  else answerQuiz(i);
});
$('#prevPage').addEventListener('click', () => { state.page--; renderList(); });
$('#nextPage').addEventListener('click', () => { state.page++; renderList(); });
$('#search').addEventListener('input', e => { state.search = e.target.value.trim(); onFilter(); });
$('#exportBtn').addEventListener('click', exportProgress);
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => { if (e.target.files[0]) importProgress(e.target.files[0]); e.target.value = ''; });
$('#resetBtn').addEventListener('click', resetProgress);

function onFilter() {
  state.page = 0;
  renderStats();
  if (state.mode === 'card') startCard();
  else if (state.mode === 'list') renderList();
  else if (state.mode === 'quiz') resetQuiz();
}

// 键盘快捷键
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { $('#freqModal').classList.add('hidden'); $('#wordModal').classList.add('hidden'); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (state.mode === 'card' && state.queue.length) {
    if (e.code === 'Space') { e.preventDefault(); if (e.target.blur) e.target.blur(); flipCard(); }
    else if (e.code === 'ArrowRight') mark(true);
    else if (e.code === 'ArrowLeft') mark(false);
  }
});

// ---------- 初始化 ----------
load();
renderLetters();
renderTierChips();
renderStatusChips();
renderQuizDirChips();
renderQuizNumChips();
renderQuizScopeChips();
renderStats();
setMode('card');
</script>
</body>
